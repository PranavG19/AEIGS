[package]
name = "aegis-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-protocol = { path = "../protocol" }
aegis-knowledge-graph = { path = "../knowledge-graph" }
aegis-audit-log = { path = "../audit-log" }
aegis-supervisor = { path = "../supervisor" }
aegis-passive-recon = { path = "../passive-recon" }
aegis-enumeration = { path = "../enumeration" }
aegis-fuzzing = { path = "../fuzzing" }
aegis-chain-synthesis = { path = "../chain-synthesis" }
aegis-reporting = { path = "../reporting" }
aegis-evasion-engine = { path = "../evasion-engine" }
aegis-crawler = { path = "../crawler" }
aegis-exploiter = { path = "../exploiter" }
aegis-discovery = { path = "../discovery" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
url = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
aegis-compliance = { path = "../compliance" }
