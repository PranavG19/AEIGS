services:
  graphql-app:
    build:
      context: ../graphql-vuln-app
    ports:
      - "${GRAPHQL_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:4000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  graphql-app-no-introspection:
    build:
      context: ../graphql-vuln-app
    ports:
      - "${GRAPHQL_NO_INTRO_PORT:-4001}:4000"
    environment:
      - DISABLE_INTROSPECTION=1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:4000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
