services:
  express-app:
    build:
      context: ../express-vuln-app
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rate-limiter:
    image: nginx:alpine
    ports:
      - "${RATE_LIMIT_PORT:-8081}:8081"
    volumes:
      - ./nginx-ratelimit.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      express-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
