services:
  express-app:
    build:
      context: ../express-vuln-app
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  detector:
    build:
      context: ../bot-detection/detector
    expose:
      - "5000"
    environment:
      - BOT_THRESHOLD=${BOT_THRESHOLD:-0.5}

  proxy:
    image: nginx:alpine
    ports:
      - "${BOT_PORT:-8082}:8082"
    volumes:
      - ./nginx-botdetect.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      express-app:
        condition: service_healthy
      detector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
