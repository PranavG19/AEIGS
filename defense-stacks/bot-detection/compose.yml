services:
  detector:
    build:
      context: ./detector
    ports:
      - "5000:5000"
    environment:
      - BOT_THRESHOLD=${BOT_THRESHOLD:-0.5}

  proxy:
    image: nginx:alpine
    ports:
      - "${BOT_PORT:-8082}:8082"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      detector:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
