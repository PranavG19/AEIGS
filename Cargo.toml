[workspace]
members = [
    "crates/protocol",
    "crates/knowledge-graph",
    "crates/audit-log",
    "crates/supervisor",
    "crates/passive-recon",
    "crates/enumeration",
    "crates/fuzzing",
    "crates/chain-synthesis",
    "crates/reporting",
    "crates/evasion-engine",
    "crates/orchestrator",
    "crates/crawler",
    "crates/compliance",
    "crates/discovery",
    "crates/exploiter",
    "crates/test-support",
    "crates/proxy",
    "crates/proxy-tui",
    "crates/aegis-c2",
    "crates/aegis-scan-tui",
    "crates/aegis-web-ui",
    "crates/aegis-arena",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ciborium = "0.2"
sha3 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
petgraph = "0.7"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
rand = "0.9"
cargo-lock = "10"
sarif_rust = "0.3"
openapiv3 = "2"
graphql-parser = "0.4"
regex = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
url = "2"
axum = "0.8"
tower = "0.5"
hyper = "1"
tempfile = "3"
parking_lot = "0.12"

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
must_use_candidate = "warn"
unwrap_used = "warn"
