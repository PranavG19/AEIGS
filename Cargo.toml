[workspace]
members = [
    "crates/protocol",
    "crates/knowledge-graph",
    "crates/audit-log",
    "crates/supervisor",
    "crates/passive-recon",
    "crates/enumeration",
    "crates/fuzzing",
    "crates/chain-synthesis",
    "crates/reporting",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ciborium = "0.2"
sha3 = "0.10"
hmac = "0.12"
petgraph = "0.7"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
rand = "0.9"
